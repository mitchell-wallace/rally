name: test

on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rally
      # go.mod has a local `replace .../chassis => ../chassis` (chassis has
      # no tagged release yet); check it out as a true sibling so it resolves.
      - uses: actions/checkout@v6
        with:
          repository: mitchell-wallace/chassis
          path: chassis

      - uses: actions/setup-go@v6
        with:
          go-version-file: rally/go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Install the released laps companion (pinned; bump alongside
      # MinLapsVersion). Release binaries carry the ldflags-injected version;
      # `go install` builds report "dev" and would trip the version floor.
      - name: Install laps
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/mitchell-wallace/laps/releases/download/v1.0.0/laps_1.0.0_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" laps
          install -m 0755 "$RUNNER_TEMP/laps" "$HOME/.local/bin/laps"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Configure opencode auth
        if: env.OPENCODE_AUTH_JSON != ''
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.local/share/opencode"
          printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"

      - name: Run tests
        working-directory: rally
        env:
          RALLY_TEST_REAL_AGENTS: "1"
        run: go test -count=1 ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rally
      - uses: actions/checkout@v6
        with:
          repository: mitchell-wallace/chassis
          path: chassis

      - uses: actions/setup-go@v6
        with:
          go-version-file: rally/go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Install the released laps companion (pinned; bump alongside
      # MinLapsVersion). Release binaries carry the ldflags-injected version;
      # `go install` builds report "dev" and would trip the version floor.
      - name: Install laps
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/mitchell-wallace/laps/releases/download/v1.0.0/laps_1.0.0_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP" laps
          install -m 0755 "$RUNNER_TEMP/laps" "$HOME/.local/bin/laps"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install opencode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Run race tests
        working-directory: rally
        run: go test -race -shuffle=on -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rally
      - uses: actions/checkout@v6
        with:
          repository: mitchell-wallace/chassis
          path: chassis

      - uses: actions/setup-go@v6
        with:
          go-version-file: rally/go.mod

      - name: go vet
        working-directory: rally
        run: go vet ./...

      - name: Check formatting
        working-directory: rally
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted correctly. Run 'gofmt -w':" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: archguard
        working-directory: rally
        run: go run ./tools/archguard --ci

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: rally
      - uses: actions/checkout@v6
        with:
          repository: mitchell-wallace/chassis
          path: chassis

      - uses: actions/setup-go@v6
        with:
          go-version-file: rally/go.mod

      - name: go mod tidy
        working-directory: rally
        run: go mod tidy

      - name: Check for module drift
        working-directory: rally
        run: git diff --exit-code go.mod go.sum

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          path: rally
      - uses: actions/checkout@v6
        with:
          repository: mitchell-wallace/chassis
          path: chassis

      - uses: actions/setup-go@v6
        with:
          go-version-file: rally/go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        working-directory: rally
        run: govulncheck ./...
